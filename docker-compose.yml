services:
  runners-dashboard:
    build:
      context: .
    container_name: actions-runners-dashboard
    environment:
      RUNNERS_DASHBOARD_HOST: 0.0.0.0
      RUNNERS_DASHBOARD_PORT: 8765
      RUNNERS_DASHBOARD_BACKEND: http://host.docker.internal:8766
    ports:
      - "127.0.0.1:8765:8765"
    pid: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/opt/actions-runners
    restart: unless-stopped